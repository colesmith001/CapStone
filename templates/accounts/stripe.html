<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <form id="save-card-form">
    {% csrf_token %}
    <div id="payment-element"></div>
    <button id="save-card-button" type="submit">Save card</button>
    <p id="card-message" role="status"></p>
  </form>

  <script>
    const form = document.querySelector("#save-card-form");
    const message = document.querySelector("#card-message");
    const button = document.querySelector("#save-card-button");
    const csrfToken = form.querySelector("[name=csrfmiddlewaretoken]").value;

    async function startCardSetup() {
      message.textContent = "Preparing secure card form...";

      const response = await fetch("{% url 'create_setup_intent' %}", {
        method: "POST",
        credentials: "same-origin",
        headers: { "X-CSRFToken": csrfToken },
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error (data.error || "could not prepare card setup.");
      }

      const stripe = Stripe("YOUR_PUBLISHABLE_KEY");
      const elements = stripe.elements({ clientSecret: data.client_secret});
      elements.create("payment").mount("#payment-element");

      message.textContent = "";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        message.textContent = "Saving card...";

        const { error } = await stripe.confirmSetup({
          elements, 
          confirmParams: {
            return_url: window.location.href,
          },
        });

        if (error){
          message.textContent = error.message;
          button.disabled = false;
        }
      });
    }

    startCardSetup().catch((error) =>{
      message.textContent = error.message;
    })

  </script>
</body>
</html>
