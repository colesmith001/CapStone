{% extends 'base.html' %}

{% block title %} Create Account {% endblock %}

{% block content %}
<h1>Create your account</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Sign up</button>
</form>

<p>Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
{% endblock %}
